name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 下載原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行 PyInstaller 打包
      run: |
        pyinstaller --onefile --noconsole exam_generator.py

    - name: 上傳打包完成的 EXE
      uses: actions/upload-artifact@v4
      with:
        name: Exam_Generator_EXE
        path: dist/*.exe
